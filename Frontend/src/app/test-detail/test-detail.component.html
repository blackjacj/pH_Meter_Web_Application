<main class="detail-page">
  <a routerLink="/tests">← Back to my experiments</a>
  <h1>Edit Test</h1>

  <form [formGroup]="form" (ngSubmit)="save()">
    <label for="name">Test name</label>
    <input id="name" type="text" formControlName="name">

    <label for="note">Note</label>
    <textarea id="note" rows="4" formControlName="note"></textarea>

    @if (error) { <p class="error">{{ error }}</p> }
    @if (message) { <p class="success">{{ message }}</p> }

    <div class="actions">
      <button type="submit" [disabled]="form.invalid">Save changes</button>
      <button type="button" (click)="downloadCsv()">Download CSV</button>
      <button type="button" class="danger" (click)="deleteTest()">Delete test</button>
    </div>
  </form>
</main>
