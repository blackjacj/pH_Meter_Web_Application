<h1>Test Settings</h1>

<section class="textfields">
   <div class="field">
    <label for="test_name">Test name</label>
    <input id="test_name" type="text" [(ngModel)]="testName" placeholder="Test name"
    [disabled]="settings.testId !== null">
  </div>
  <div class="field">
    <label for="test_note">Test note</label>
    <input id="test_note" type="text" [(ngModel)]="testNote" placeholder="Optional"
    [disabled]="settings.testId !== null">
  </div>
  <div class="field">
    <label for="port">Arduino port</label>
    <select id="port" [(ngModel)]="settings.port" [disabled]="settings.startButtonPressed">
      @for (p of ports; track p.device) {
        <option [value]="p.device">{{ p.device }} ({{ p.description }})</option>
      } @empty {
        <option [value]="settings.port">No Arduino found</option>
      }
    </select>
    <button (click)="loadPorts()" [disabled]="settings.startButtonPressed">Refresh</button>
  </div>
  <div class="field">
    <label for="test_length">Test length (seconds)</label>
    <input type="number" id="test_length" [(ngModel)]="seconds" placeholder="e.g. 60">
    <button (click)="setSeconds(seconds)">Apply</button>
  </div>
  <div class="field">
    <label for="graph_seconds">Seconds shown on graph</label>
    <input id="graph_seconds" type="number" [(ngModel)]="graph_seconds" placeholder="Displayed seconds on graph">
    <button (click)="setPoint(graph_seconds)">Apply</button>
  </div>
</section>

@if (error) {
  <p class="error">{{ error }}</p>
}

<section class="buttons">
  <div class="start">
    <button (click)="pressStart()">Start</button>
  </div>
  <div class="stop">
    <button (click)="pressStop()">Stop</button>
  </div>
</section>
