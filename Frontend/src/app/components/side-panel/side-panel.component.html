<h1>Test Settings</h1>

<section class="textfields">
  <div class="field">
    <label for="test_length">Test length (seconds)</label>
    <input type="number" id="test_length" [(ngModel)]="seconds" placeholder="e.g. 60">
    <button (click)="setSeconds(seconds)">Apply</button>
  </div>
  <div class="field">
    <label for="graph_seconds">Seconds shown on graph</label>
    <input type="number" [(ngModel)]="graph_seconds" placeholder="Displayed seconds on graph">
    <button (click)="setPoint(graph_seconds)">Apply</button>
  </div>
</section>

<section class="buttons">
  <div class="start">
    <button (click)="pressStart()">Start</button>
  </div>
  <div class="pause">
    <button (click)="pressPause()">Pause</button>
  </div>
  <div class="stop">
    <button (click)="pressStop()">Stop</button>
  </div>
</section>
