<h1>Test Settings</h1>

<section class="textfields">
   <div class="field">
    <label for="test_name">Test name</label>
    <input id="test_name" type="text" [(ngModel)]="testName" placeholder="Test name"
    [disabled]="settings.testId !== null">
  </div>
  <div class="field">
    <label for="test_note">Test note</label>
    <input id="test_note" type="text" [(ngModel)]="testNote" placeholder="Optional"
    [disabled]="settings.testId !== null">
  </div>
  <div class="field">
    <label for="port">Arduino port</label>
    <select id="port" [(ngModel)]="settings.port" [disabled]="settings.startButtonPressed">
      @for (p of ports; track p.device) {
        <option [value]="p.device">{{ p.device }} ({{ p.description }})</option>
      } @empty {
        <option [value]="settings.port">No Ports Found</option>
      }
    </select>
    <button (click)="loadPorts()" [disabled]="settings.startButtonPressed">Refresh</button>
  </div>
  <div class="field time-field">
    <span class="field-title">Test length</span>

    <div class="time-inputs">
      <div class="time-box">
        <label for="test_length_hours">Hours</label>
        <input id="test_length_hours" type="number" min="0" [(ngModel)]="hours">
      </div>
      <div class="time-box">
        <label for="test_length_minutes">Minutes</label>
        <input id="test_length_minutes" type="number" min="0" [(ngModel)]="minutes">
      </div>
      <div class="time-box">
        <label for="test_length_seconds">Seconds</label>
        <input id="test_length_seconds" type="number" min="0" [(ngModel)]="seconds">
      </div>
    </div>

    <button (click)="setSeconds(hours, minutes, seconds)">Apply</button>
  </div>
</section>

@if (error) {
  <p class="error">{{ error }}</p>
}

<section class="buttons">
  <div class="start">
    <button (click)="pressStart()">Start</button>
  </div>
  <div class="stop">
    <button (click)="pressStop()">Stop</button>
  </div>
</section>
